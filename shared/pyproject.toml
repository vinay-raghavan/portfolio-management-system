[project]
name = "portfolio-shared"
version = "0.1.0"
description = "Shared code for Portfolio Management System - providers, strategies, and models"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Portfolio Management Team"}
]
keywords = ["trading", "portfolio", "strategies", "providers"]

dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "yfinance>=0.2.0",
    "ta>=0.11.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.0.0",
    "fyers-apiv3>=3.1.7",
    # Security: override transitive deps to fix vulnerabilities
    # Note: aiohttp/requests cannot be upgraded due to fyers-apiv3 pinning exact versions
    "protobuf>=6.0.0",
    "urllib3>=2.6.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]

[tool.hatch.build.targets.sdist]
include = ["shared"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "bandit>=1.9.3",
    "pip-audit>=2.10.0",
]

[tool.uv]
# Force override fyers-apiv3's pinned dependencies to fix security vulnerabilities
override-dependencies = [
    "aiohttp>=3.11.0",
    "requests>=2.32.0",
    "setuptools>=78.1.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

