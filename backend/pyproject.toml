[project]
name = "portfolio-backend"
version = "0.1.0"
description = "Portfolio Management System - Backend API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.28.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "pandas>=2.2.0",
    "numpy>=2.1.0",
    "yfinance>=0.2.50",
    "ta>=0.11.0",
    "python-multipart>=0.0.22",
    "bcrypt<5.0.0",
    # Shared package
    "portfolio-shared",
    "fyers-apiv3==3.1.11",
    "pyasn1==0.6.3",
    "urllib3>=2.6.3",
    # Security: override transitive deps to fix vulnerabilities
    # Note: aiohttp/requests cannot be upgraded due to fyers-apiv3 pinning exact versions
    "protobuf>=6.0.0",
]

[tool.uv]
# Force override fyers-apiv3's pinned dependencies to fix security vulnerabilities
override-dependencies = [
    "aiohttp>=3.11.0",
    "requests>=2.32.0",
    "setuptools>=78.1.1",
    "mako>=1.3.12",
]

[tool.uv.sources]
portfolio-shared = { path = "../shared", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.0",
    "bandit>=1.9.3",
    "pip-audit>=2.10.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.10",
]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B904",   # raise without from inside except
    "ARG001", # unused function argument (often required by interface/framework)
    "ARG002", # unused method argument (often required by abstract class)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ty]
python-version = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

