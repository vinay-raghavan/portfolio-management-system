# Production docker-compose using GHCR images
# Usage: docker-compose -f docker-compose.prod.yml up -d
#
# Pull latest images first:
#   docker pull ghcr.io/vinay-raghavan/portfolio-api:latest
#   docker pull ghcr.io/vinay-raghavan/portfolio-trading-engine:latest
#   docker pull ghcr.io/vinay-raghavan/portfolio-web:latest
#   docker pull ghcr.io/vinay-raghavan/portfolio-worker:latest
#   docker pull ghcr.io/vinay-raghavan/portfolio-migrations:latest
#
# Or use a specific version:
#   VERSION=v1.2.1 docker-compose -f docker-compose.prod.yml up -d

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: portfolio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: portfolio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portfolio-net

  redis:
    image: redis:7-alpine
    container_name: portfolio-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portfolio-net

  migrations:
    image: ghcr.io/vinay-raghavan/portfolio-migrations:${VERSION:-v1.2.1}
    container_name: portfolio-migrations
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/portfolio
    # Chainguard image has ENTRYPOINT [/usr/bin/python], so we omit "python" from CMD
    command: ["-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - portfolio-net
    restart: "no"

  api:
    image: ghcr.io/vinay-raghavan/portfolio-api:${VERSION:-v1.2.1}
    container_name: portfolio-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/portfolio
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      DEBUG: "false"
      SKIP_DB_INIT: "true"
      DATA_PROVIDER: ${DATA_PROVIDER:-yahoo}
      DEFAULT_MARKET: ${DEFAULT_MARKET:-IN}
      TRADING_ENGINE_URL: http://trading-engine:8001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-worker-key}
    ports:
      - "${API_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - portfolio-net

  trading-engine:
    image: ghcr.io/vinay-raghavan/portfolio-trading-engine:${VERSION:-v1.2.1}
    container_name: portfolio-trading-engine
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/portfolio
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-worker-key}
      DATA_PROVIDER: ${DATA_PROVIDER:-yahoo}
      DEFAULT_MARKET: ${DEFAULT_MARKET:-IN}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${TRADING_ENGINE_PORT:-8011}:8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - portfolio-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  web:
    image: ghcr.io/vinay-raghavan/portfolio-web:${VERSION:-v1.2.1}
    container_name: portfolio-web
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3001}:3000"
    depends_on:
      - api
    networks:
      - portfolio-net

  worker:
    image: ghcr.io/vinay-raghavan/portfolio-worker:${VERSION:-v1.2.1}
    container_name: portfolio-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/portfolio
      REDIS_URL: redis://redis:6379/0
      INTERNAL_API_URL: http://trading-engine:8001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-worker-key}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - portfolio-net

  beat:
    image: ghcr.io/vinay-raghavan/portfolio-worker:${VERSION:-v1.2.1}
    container_name: portfolio-beat
    restart: unless-stopped
    # Chainguard image has ENTRYPOINT [/usr/bin/python], so we omit "python" from CMD
    command: ["-m", "celery", "-A", "worker.celery_app", "beat", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/portfolio
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - portfolio-net

volumes:
  postgres_data:
  redis_data:

networks:
  portfolio-net:
    name: portfolio-network
    driver: bridge

