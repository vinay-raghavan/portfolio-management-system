name: CI

on:
  pull_request:
  push:

jobs:
  backend-lint:
    name: Backend - Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --dev

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

  backend-security:
    name: Backend - Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --dev

      - name: Run bandit (static security analysis)
        run: uv run bandit -r app -f txt -ll

      - name: Run pip-audit (dependency vulnerabilities)
        run: |
          uv run pip-audit \
            --ignore-vuln CVE-2024-27306 \
            --ignore-vuln CVE-2024-30251 \
            --ignore-vuln CVE-2024-52304 \
            --ignore-vuln CVE-2025-53643 \
            --ignore-vuln CVE-2025-69223 \
            --ignore-vuln CVE-2025-69224 \
            --ignore-vuln CVE-2025-69225 \
            --ignore-vuln CVE-2025-69226 \
            --ignore-vuln CVE-2025-69227 \
            --ignore-vuln CVE-2025-69228 \
            --ignore-vuln CVE-2025-69229 \
            --ignore-vuln CVE-2025-69230 \
            --ignore-vuln CVE-2024-35195 \
            --ignore-vuln CVE-2024-47081 \
            --ignore-vuln CVE-2025-4565 \
            --ignore-vuln CVE-2026-0994 \
            --ignore-vuln CVE-2024-6345 \
            --ignore-vuln PYSEC-2025-49 \
            --ignore-vuln CVE-2024-23342 \
            --ignore-vuln CVE-2026-3219

  backend-test:
    name: Backend - Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
