name: Build and Publish Docker Images

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/portfolio

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: api
            dockerfile: backend/Dockerfile
            context: .
          - service: trading-engine
            dockerfile: trading-engine/Dockerfile
            context: .
          - service: web
            dockerfile: frontend/Dockerfile
            context: ./frontend
          - service: worker
            dockerfile: worker/Dockerfile
            context: .
          - service: migrations
            dockerfile: backend/Dockerfile
            context: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: prod
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          body: |
            ## Docker Images
            
            Pull the images from GitHub Container Registry:
            
            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/portfolio-api:${{ github.ref_name }}
            docker pull ghcr.io/${{ github.repository_owner }}/portfolio-trading-engine:${{ github.ref_name }}
            docker pull ghcr.io/${{ github.repository_owner }}/portfolio-web:${{ github.ref_name }}
            docker pull ghcr.io/${{ github.repository_owner }}/portfolio-worker:${{ github.ref_name }}
            docker pull ghcr.io/${{ github.repository_owner }}/portfolio-migrations:${{ github.ref_name }}
            ```

