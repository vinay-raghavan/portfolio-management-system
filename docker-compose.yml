services:
  # PostgreSQL with TimescaleDB
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: portfolio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: portfolio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portfolio-net

  # Redis for caching and Celery broker
  redis:
    image: redis:7-alpine
    container_name: portfolio-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portfolio-net

  # Database Migrations
  migrations:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    container_name: portfolio-migrations
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/portfolio
    command: ["uv", "run", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - portfolio-net
    restart: "no"

  # Backend API
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    container_name: portfolio-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/portfolio
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      DEBUG: "false"
      SKIP_DB_INIT: "true"
      DATA_PROVIDER: ${DATA_PROVIDER:-yahoo}
      DEFAULT_MARKET: ${DEFAULT_MARKET:-IN}
      TRADING_ENGINE_URL: http://trading-engine:8001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-worker-key}
    ports:
      - "${API_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - portfolio-net

  # Trading Engine - Strategy Execution Service
  trading-engine:
    build:
      context: .
      dockerfile: trading-engine/Dockerfile
      target: dev
    container_name: portfolio-trading-engine
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/portfolio
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-worker-key}
      DATA_PROVIDER: ${DATA_PROVIDER:-yahoo}
      DEFAULT_MARKET: ${DEFAULT_MARKET:-IN}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${TRADING_ENGINE_PORT:-8011}:8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - portfolio-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # Frontend
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: portfolio-web
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3001}:3000"
    depends_on:
      - api
    networks:
      - portfolio-net

  # Celery Worker
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
      target: dev
    container_name: portfolio-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/portfolio
      REDIS_URL: redis://redis:6379/0
      INTERNAL_API_URL: http://trading-engine:8001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal-worker-key}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      trading-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - portfolio-net

  # Celery Beat (scheduler)
  beat:
    build:
      context: .
      dockerfile: worker/Dockerfile
      target: dev
    container_name: portfolio-beat
    restart: unless-stopped
    command: ["uv", "run", "celery", "-A", "worker.celery_app", "beat", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/portfolio
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - portfolio-net

volumes:
  postgres_data:
  redis_data:

networks:
  portfolio-net:
    name: portfolio-network
    driver: bridge

