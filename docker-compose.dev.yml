# Development overrides - run with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # PostgreSQL with TimescaleDB - dev ports
  db:
    ports:
      - "5432:5432"

  # Redis - dev ports
  redis:
    ports:
      - "6379:6379"

  # Migrations - development mode with volume mount
  migrations:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
      - /app/.venv

  # Backend API - development mode with hot reload
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
    environment:
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/portfolio
      REDIS_URL: redis://redis:6379
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend - development mode with hot reload
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
    command: npm run dev

  # Celery Worker - development mode with auto-reload
  worker:
    volumes:
      - ./worker:/app
    command: celery -A worker.celery_app worker --loglevel=debug

  # Celery Beat
  beat:
    volumes:
      - ./worker:/app
    command: celery -A worker.celery_app beat --loglevel=debug
