[project]
name = "trading-engine"
version = "0.1.0"
description = "Portfolio Management System - Trading Engine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    # Redis
    "redis>=5.2.0",
    # Data & Analysis
    "pandas>=2.2.0",
    "numpy>=2.1.0",
    "yfinance>=0.2.50",
    "ta>=0.11.0",
    # HTTP client
    "httpx>=0.28.0",
    # Validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # Monitoring
    "prometheus-client>=0.21.0",
    # Async utilities
    "tenacity>=9.0.0",
    # Shared package
    "portfolio-shared",
    "cryptography>=46.0.5",
]

[tool.uv.sources]
portfolio-shared = { path = "../shared", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "ruff>=0.14.10",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "bandit>=1.9.3",
    "pip-audit>=2.10.0",
]

